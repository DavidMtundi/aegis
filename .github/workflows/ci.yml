name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: aegis_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release
    - name: Test
      env:
        AEGIS_TEST_CONNECTION: Host=localhost;Port=5432;Database=aegis_test;Username=aegis;Password=aegis_dev_password
      run: |
        PGPASSWORD=aegis_dev_password psql -h localhost -U aegis -d aegis -c "SELECT 1" >/dev/null
        PGPASSWORD=aegis_dev_password psql -h localhost -U aegis -d aegis -tc "SELECT 1 FROM pg_database WHERE datname='aegis_test'" | grep -q 1 \
          || PGPASSWORD=aegis_dev_password psql -h localhost -U aegis -d aegis -c "CREATE DATABASE aegis_test"
        dotnet test --no-build --configuration Release --verbosity normal
    - name: Vulnerable package audit
      run: |
        set -euo pipefail
        # Fail the job if any package reports a known vulnerability (Severity >= Moderate).
        dotnet list package --vulnerable --include-transitive --format json > /tmp/vuln.json
        if grep -q '"VulnerabilityId"' /tmp/vuln.json; then
          echo "Vulnerable packages detected:"
          cat /tmp/vuln.json
          exit 1
        fi
        echo "No vulnerable packages reported."

  container:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build container image
      run: docker build -t aegis-api:ci .
